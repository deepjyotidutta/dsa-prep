<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Day 1 · Arrays, Strings &amp; HashMaps</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f0f4ff; font-family: 'Segoe UI', Arial, sans-serif; }
    button { font-family: inherit; }
  </style>
</head>
<body>
<div id="app" style="max-width:800px;margin:0 auto;padding-bottom:40px;background:#fff;min-height:100vh;"></div>

<script>
// ─── DATA ───────────────────────────────────────────────────
const sections = [
  {
    id: "arrays",
    title: "1. Arrays (Lists in Python)",
    color: "#0f3460",
    content: [
      {
        type: "text",
        body: `In Python, the built-in list is your array. It's a dynamic array — it resizes automatically, stores any type, and gives you O(1) access by index.`
      },
      {
        type: "code",
        label: "Core Operations",
        code: `# Create
nums = [3, 1, 4, 1, 5, 9]

# Access — O(1)
print(nums[0])       # 3
print(nums[-1])      # 9  (last element)

# Slice — O(k)
print(nums[1:4])     # [1, 4, 1]

# Append — O(1) amortized
nums.append(2)

# Insert at index — O(n)
nums.insert(2, 99)

# Remove by value — O(n)
nums.remove(99)

# Pop last — O(1)
nums.pop()

# Length
print(len(nums))     # 6

# Iterate
for n in nums:
    print(n)

# Enumerate (index + value)
for i, n in enumerate(nums):
    print(i, n)`
      },
      {
        type: "callout",
        kind: "tip",
        body: `Interview signal: Always say 'I'll use a list here because access is O(1) and appending is amortized O(1).' Interviewers love when you name complexity unprompted.`
      },
      {
        type: "complexity",
        rows: [
          ["Access by index",   "O(1)"],
          ["Search (unsorted)", "O(n)"],
          ["Append",            "O(1) amortized"],
          ["Insert at index",   "O(n)"],
          ["Delete by index",   "O(n)"],
        ]
      }
    ]
  },
  {
    id: "strings",
    title: "2. Strings in Python",
    color: "#16213e",
    content: [
      {
        type: "text",
        body: "Strings are immutable sequences of characters. This is a critical interview detail — you CANNOT modify a string in place. Any 'modification' creates a new string."
      },
      {
        type: "code",
        label: "Key String Operations",
        code: `s = "hello world"

# Length
len(s)              # 11

# Access char — O(1)
s[0]                # 'h'
s[-1]               # 'd'

# Slice
s[0:5]              # 'hello'
s[::-1]             # 'dlrow olleh' (reverse)

# Common methods
s.upper()           # 'HELLO WORLD'
s.lower()           # 'hello world'
s.split()           # ['hello', 'world']
s.split(',')        # split on comma
s.strip()           # remove leading/trailing whitespace
s.replace('l','x')  # 'hexxo worxd'

# Check content
s.isalnum()         # True if all letters/digits
s.isalpha()         # True if all letters
s.isdigit()         # True if all digits

# Join list into string
words = ['a', 'b', 'c']
'-'.join(words)     # 'a-b-c'
''.join(words)      # 'abc'

# String is iterable
for ch in s:
    print(ch)

# Slicing creates new string (immutable!)
s2 = s             # both point to same object
# s[0] = 'H'       # ❌ TypeError — strings are immutable!`
      },
      {
        type: "callout",
        kind: "warn",
        body: `Building a string with += in a loop is O(n²) because each += creates a new string. Use a list to collect chars, then ''.join() at the end — that's O(n).`
      },
      {
        type: "code",
        label: "Efficient String Building",
        code: `# ❌ Slow — O(n²)
result = ""
for ch in ['a','b','c','d']:
    result += ch

# ✅ Fast — O(n)
parts = []
for ch in ['a','b','c','d']:
    parts.append(ch)
result = "".join(parts)`
      }
    ]
  },
  {
    id: "hashmap",
    title: "3. HashMaps (dict) & HashSets (set)",
    color: "#e94560",
    content: [
      {
        type: "text",
        body: "In Python, dict is your HashMap. It maps unique keys to values in O(1) average time for get/set/delete. set is your HashSet — unique elements only, O(1) membership check."
      },
      {
        type: "code",
        label: "dict — HashMap",
        code: `# Create
freq = {}
freq = dict()
freq = {"a": 1, "b": 2}

# Set / update — O(1)
freq["c"] = 3
freq["a"] += 1

# Get — O(1)
freq["a"]           # 2 (KeyError if missing!)
freq.get("z")       # None (safe)
freq.get("z", 0)    # 0  (default value)

# Check key exists — O(1)
"a" in freq         # True

# Delete — O(1)
del freq["b"]
freq.pop("c", None) # safe delete with default

# Iterate
for key in freq:            # keys
    print(key)

for val in freq.values():   # values
    print(val)

for k, v in freq.items():   # both
    print(k, v)

# Useful: defaultdict avoids KeyError
from collections import defaultdict
freq2 = defaultdict(int)    # default value = 0
freq2["x"] += 1             # no KeyError!

# Useful: Counter — count frequencies in one line
from collections import Counter
s = "aabbcca"
cnt = Counter(s)    # Counter({'a': 3, 'b': 2, 'c': 2})
cnt.most_common(2)  # [('a', 3), ('b', 2)]`
      },
      {
        type: "code",
        label: "set — HashSet",
        code: `# Create
seen = set()
seen = {1, 2, 3}

# Add — O(1)
seen.add(4)

# Check membership — O(1)  ← KEY interview use case
4 in seen           # True
5 in seen           # False

# Remove — O(1)
seen.remove(4)      # KeyError if missing
seen.discard(99)    # safe — no error

# Set operations
a = {1, 2, 3}
b = {2, 3, 4}
a & b   # intersection → {2, 3}
a | b   # union        → {1, 2, 3, 4}
a - b   # difference   → {1}`
      },
      {
        type: "callout",
        kind: "tip",
        body: "HashMap vs HashSet: Use dict when you need to store associated data (key → value). Use set when you only need to track existence — e.g., 'have I seen this number before?'"
      },
      {
        type: "complexity",
        rows: [
          ["Get / Set / Delete",   "O(1) average"],
          ["Search (key in dict)", "O(1) average"],
          ["Iterate all keys",     "O(n)"],
          ["set membership",       "O(1) average"],
        ]
      }
    ]
  },
  {
    id: "patterns",
    title: "4. Day 1 Problem Patterns",
    color: "#27ae60",
    content: [
      {
        type: "text",
        body: "Now let's connect all three structures to your Day 1 problems. Every pattern below appears directly in Two Sum, Best Time to Buy Stock, and Contains Duplicate."
      },
      {
        type: "code",
        label: "Two Sum — HashMap pattern",
        code: `# LC #1 — Two Sum
# Find indices of two numbers that add up to target.
# Key insight: for each num, check if (target - num) exists.

def twoSum(nums, target):
    seen = {}  # value → index

    for i, num in enumerate(nums):
        complement = target - num
        if complement in seen:        # O(1) lookup
            return [seen[complement], i]
        seen[num] = i                 # store for future

    return []

# Time: O(n)  |  Space: O(n)
# Without HashMap it would be O(n²) — nested loops`
      },
      {
        type: "code",
        label: "Contains Duplicate — HashSet pattern",
        code: `# LC #217 — Contains Duplicate
# Return True if any value appears at least twice.

def containsDuplicate(nums):
    seen = set()
    for n in nums:
        if n in seen:     # O(1) — already encountered
            return True
        seen.add(n)
    return False

# Shorter version (but slightly less efficient — builds whole set first):
def containsDuplicate_v2(nums):
    return len(nums) != len(set(nums))

# Time: O(n)  |  Space: O(n)`
      },
      {
        type: "code",
        label: "Best Time to Buy & Sell Stock — Array / Two-pass",
        code: `# LC #121 — Best Time to Buy and Sell Stock
# Find max profit from one buy + one sell (buy before sell).

def maxProfit(prices):
    min_price = float('inf')
    max_profit = 0

    for price in prices:
        if price < min_price:
            min_price = price           # update cheapest buy
        elif price - min_price > max_profit:
            max_profit = price - min_price  # update best profit

    return max_profit

# Time: O(n)  |  Space: O(1)
# Key trick: track the minimum seen SO FAR as you scan left to right.
# At each price, ask: "if I sell today, what's my profit?"`
      }
    ]
  },
  {
    id: "quiz",
    title: "5. Day 1 Quick Quiz",
    color: "#8e44ad",
    content: [{ type: "quiz" }]
  }
];

const quizData = [
  {
    q: "What is the time complexity of looking up a key in a Python dict?",
    options: ["O(log n)", "O(n)", "O(1) average", "O(n²)"],
    answer: 2,
    explain: "Python dicts are hash tables — average O(1) for get, set, and delete."
  },
  {
    q: "Why can't you do s[0] = 'H' on a Python string?",
    options: ["Strings don't support indexing", "Strings are immutable — you can only create new strings", "You need to use s.replace()", "Python strings are stored as linked lists"],
    answer: 1,
    explain: "Strings in Python are immutable. Any change creates a new string object."
  },
  {
    q: "You want to check if a number was seen before in a stream. Which structure is most efficient?",
    options: ["list (scan each time)", "set (O(1) lookup)", "dict (store index too)", "sorted list + binary search"],
    answer: 1,
    explain: "set gives O(1) membership check. Use dict only if you also need to store associated data (like an index)."
  },
  {
    q: "In Two Sum, why do we use a HashMap instead of a nested loop?",
    options: [
      "Nested loops are always wrong",
      "HashMap gives O(1) lookup so we go from O(n²) to O(n)",
      "Lists can't store duplicates",
      "HashMap uses less memory"
    ],
    answer: 1,
    explain: "The nested loop checks every pair — O(n²). With a HashMap, for each number we check if its complement exists in O(1), making the whole pass O(n)."
  },
  {
    q: "What does ''.join(['a','b','c']) return?",
    options: ["['a','b','c']", "'a b c'", "'abc'", "Error"],
    answer: 2,
    explain: "join() concatenates list elements using the separator string. Empty string separator produces 'abc'."
  }
];

// ─── STATE ──────────────────────────────────────────────────
let active = "arrays";
let quizAnswers = {};
let quizSubmitted = false;
const codeBlocks = [];

// ─── HELPERS ────────────────────────────────────────────────
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function copyCode(idx) {
  navigator.clipboard.writeText(codeBlocks[idx]).then(() => {
    const btn = document.getElementById('cb-' + idx);
    if (!btn) return;
    btn.textContent = 'Copied!';
    btn.style.background = '#27ae60';
    setTimeout(() => { btn.textContent = 'Copy'; btn.style.background = '#333'; }, 1500);
  });
}

function setActive(id) { active = id; render(); }
function selectAnswer(qi, oi) { if (!quizSubmitted) { quizAnswers[qi] = oi; render(); } }
function submitQuiz() { if (Object.keys(quizAnswers).length >= quizData.length) { quizSubmitted = true; render(); } }
function retryQuiz() { quizAnswers = {}; quizSubmitted = false; render(); }

// ─── COMPONENT RENDERERS ────────────────────────────────────
function renderComplexityTable(rows) {
  const rowsHtml = rows.map(([op, cmp], i) =>
    `<tr style="background:${i % 2 === 0 ? '#f5f7ff' : '#fff'}">
      <td style="padding:7px 12px;border-bottom:1px solid #dde3f0">${esc(op)}</td>
      <td style="padding:7px 12px;border-bottom:1px solid #dde3f0;font-weight:700;color:#e94560;font-family:monospace">${esc(cmp)}</td>
    </tr>`
  ).join('');
  return `
    <div style="overflow-x:auto;margin:10px 0">
      <table style="width:100%;border-collapse:collapse;font-size:13px">
        <thead>
          <tr style="background:#0f3460;color:#fff">
            <th style="padding:8px 12px;text-align:left">Operation</th>
            <th style="padding:8px 12px;text-align:left">Complexity</th>
          </tr>
        </thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>`;
}

function renderCodeBlock(label, code, idx) {
  codeBlocks[idx] = code;
  return `
    <div style="margin:12px 0">
      ${label ? `<div style="font-size:12px;font-weight:700;color:#666;margin-bottom:4px;text-transform:uppercase;letter-spacing:0.5px">${esc(label)}</div>` : ''}
      <div style="position:relative;background:#1a1a2e;border-radius:8px;overflow:hidden">
        <button id="cb-${idx}" onclick="copyCode(${idx})"
          style="position:absolute;top:8px;right:10px;background:#333;color:#fff;border:none;border-radius:4px;padding:3px 10px;font-size:11px;cursor:pointer">Copy</button>
        <pre style="margin:0;padding:16px 14px;padding-right:70px;overflow-x:auto;color:#e0e0e0;font-family:'Courier New',monospace;font-size:12.5px;line-height:1.7">${esc(code)}</pre>
      </div>
    </div>`;
}

function renderCallout(kind, body) {
  const map = {
    tip:  { bg: '#eafaf1', border: '#27ae60', icon: '💡', label: 'Interview Tip' },
    warn: { bg: '#fef9e7', border: '#f39c12', icon: '⚠️', label: 'Watch Out' },
  };
  const s = map[kind] || map.tip;
  return `
    <div style="background:${s.bg};border-left:4px solid ${s.border};border-radius:0 8px 8px 0;padding:12px 16px;margin:12px 0">
      <div style="font-weight:700;font-size:12px;margin-bottom:4px">${s.icon} ${s.label}</div>
      <div style="font-size:13.5px">${esc(body)}</div>
    </div>`;
}

function renderQuiz() {
  const answered = Object.keys(quizAnswers).length;
  const score = quizSubmitted ? quizData.filter((q, i) => quizAnswers[i] === q.answer).length : 0;

  const questionsHtml = quizData.map((q, qi) => {
    const optionsHtml = q.options.map((opt, oi) => {
      let bg = '#fff', border = '1px solid #ddd';
      if (quizSubmitted) {
        if (oi === q.answer)             { bg = '#eafaf1'; border = '2px solid #27ae60'; }
        else if (quizAnswers[qi] === oi) { bg = '#fdedec'; border = '2px solid #e74c3c'; }
      } else if (quizAnswers[qi] === oi) {
        bg = '#e8eeff'; border = '2px solid #0f3460';
      }
      const click = quizSubmitted ? '' : `onclick="selectAnswer(${qi},${oi})"`;
      return `<div ${click} style="background:${bg};border:${border};border-radius:6px;padding:8px 12px;margin-bottom:6px;cursor:${quizSubmitted ? 'default' : 'pointer'};font-size:13.5px;transition:all 0.15s">${esc(opt)}</div>`;
    }).join('');

    const explainHtml = quizSubmitted
      ? `<div style="margin-top:8px;font-size:12.5px;color:#555;background:#f0f4ff;padding:8px 12px;border-radius:6px"><strong>Explanation:</strong> ${esc(q.explain)}</div>`
      : '';

    return `
      <div style="background:#fafbff;border:1.5px solid #c5cce8;border-radius:8px;padding:14px 16px;margin-bottom:14px">
        <div style="font-weight:600;margin-bottom:10px;font-size:14px">Q${qi + 1}. ${esc(q.q)}</div>
        ${optionsHtml}${explainHtml}
      </div>`;
  }).join('');

  const footerHtml = !quizSubmitted
    ? `<button onclick="submitQuiz()" ${answered < quizData.length ? 'disabled' : ''}
        style="background:${answered < quizData.length ? '#ccc' : '#0f3460'};color:#fff;border:none;padding:12px 28px;border-radius:8px;font-size:14px;cursor:${answered < quizData.length ? 'not-allowed' : 'pointer'};width:100%">
        Submit Answers (${answered}/${quizData.length} answered)
      </button>`
    : `<div style="text-align:center;padding:18px;border-radius:10px;background:${score >= 4 ? '#eafaf1' : '#fef9e7'};border:2px solid ${score >= 4 ? '#27ae60' : '#f39c12'}">
        <div style="font-size:28px;font-weight:800">${score}/${quizData.length}</div>
        <div style="font-weight:600;margin-top:4px">${score >= 4 ? '✅ Ready for Day 1 problems!' : '⚠️ Review the sections above before solving'}</div>
        <button onclick="retryQuiz()" style="margin-top:12px;background:#0f3460;color:#fff;border:none;padding:8px 20px;border-radius:6px;cursor:pointer;font-size:13px">Retry Quiz</button>
      </div>`;

  return questionsHtml + footerHtml;
}

// ─── MAIN RENDER ────────────────────────────────────────────
function render() {
  codeBlocks.length = 0;
  let codeIdx = 0;

  const activeSection = sections.find(s => s.id === active);
  const activeIdx     = sections.findIndex(s => s.id === active);

  const tabsHtml = sections.map(s => {
    const num  = s.title.split('.')[0];
    const word = (s.title.split('. ')[1] || '').split(' ')[0];
    const isActive = s.id === active;
    return `<button onclick="setActive('${s.id}')"
      style="flex:0 0 auto;padding:12px 16px;background:${isActive ? s.color : 'transparent'};color:${isActive ? '#fff' : '#333'};border:none;cursor:pointer;font-weight:600;font-size:12.5px;white-space:nowrap;transition:all 0.2s;border-bottom:${isActive ? `3px solid ${s.color}` : '3px solid transparent'}"
    >${esc(num + '. ' + word)}</button>`;
  }).join('');

  const contentHtml = activeSection.content.map(block => {
    if (block.type === 'text')       return `<p style="font-size:14px;line-height:1.7;color:#333">${esc(block.body)}</p>`;
    if (block.type === 'code')       return renderCodeBlock(block.label, block.code, codeIdx++);
    if (block.type === 'callout')    return renderCallout(block.kind, block.body);
    if (block.type === 'complexity') return renderComplexityTable(block.rows);
    if (block.type === 'quiz')       return renderQuiz();
    return '';
  }).join('');

  const prevBtn = activeIdx > 0
    ? `<button onclick="setActive('${sections[activeIdx - 1].id}')" style="background:#f0f4ff;border:1px solid #dde3f0;padding:10px 18px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600">← Previous</button>`
    : '<div></div>';
  const nextBtn = activeIdx < sections.length - 1
    ? `<button onclick="setActive('${sections[activeIdx + 1].id}')" style="background:#0f3460;color:#fff;border:none;padding:10px 18px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600">Next →</button>`
    : '<div></div>';

  document.getElementById('app').innerHTML = `
    <div style="background:linear-gradient(135deg,#0f3460 0%,#16213e 60%,#e94560 100%);color:#fff;padding:28px 24px 22px">
      <div style="font-size:11px;font-weight:700;opacity:0.7;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px">Day 1 · Week 1 · FAANG+ Prep</div>
      <h1 style="margin:0;font-size:22px;font-weight:800">Arrays, Strings &amp; HashMaps</h1>
      <div style="margin-top:8px;opacity:0.8;font-size:13px">🎯 Problems today: Two Sum #1 · Best Time to Buy Stock #121 · Contains Duplicate #217</div>
    </div>

    <div style="display:flex;overflow-x:auto;background:#f0f4ff;border-bottom:2px solid #dde3f0">
      ${tabsHtml}
    </div>

    <div style="padding:20px">
      <h2 style="color:${activeSection.color};font-size:17px;margin-top:0;padding-bottom:8px;border-bottom:3px solid ${activeSection.color}">
        ${esc(activeSection.title)}
      </h2>
      ${contentHtml}
    </div>

    <div style="display:flex;justify-content:space-between;padding:0 20px;margin-top:10px">
      ${prevBtn}
      ${nextBtn}
    </div>`;
}

render();
</script>
</body>
</html>
